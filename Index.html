<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kartik.ai</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, sans-serif;
  background: #ffffff;
  color: #111827;
  height: 100vh;
  display: flex;
  flex-direction: column;
}

/* Header */
.header {
  height: 60px;
  border-bottom: 1px solid #e5e7eb;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 18px;
  background: white;
}

.logo {
  font-size: 21px;
  font-weight: bold;
}

.logo span {
  color: #2563eb;
}

#themeBtn {
  border: none;
  background: #f3f4f6;
  border-radius: 10px;
  padding: 9px 12px;
  cursor: pointer;
  font-size: 17px;
}

/* Chat */
.chat {
  flex: 1;
  overflow-y: auto;
  padding: 25px 15px 120px;
}

.message {
  max-width: 800px;
  margin: 0 auto 18px;
  display: flex;
}

.message.user {
  justify-content: flex-end;
}

.bubble {
  max-width: 75%;
  padding: 12px 15px;
  border-radius: 16px;
  line-height: 1.5;
  white-space: pre-wrap;
}

.ai .bubble {
  background: #f3f4f6;
}

.user .bubble {
  background: #2563eb;
  color: white;
}

/* Welcome */
.welcome {
  text-align: center;
  margin-top: 12vh;
}

.welcome h1 {
  font-size: 32px;
  margin-bottom: 10px;
}

.welcome p {
  color: #6b7280;
}

/* Input area */
.input-area {
  position: fixed;
  bottom: 0;
  left: 0;
  width: 100%;
  background: rgba(255,255,255,0.96);
  border-top: 1px solid #e5e7eb;
  padding: 12px;
}

.input-box {
  max-width: 800px;
  margin: auto;
  display: flex;
  gap: 8px;
  background: #f3f4f6;
  padding: 7px;
  border-radius: 16px;
}

#userInput {
  flex: 1;
  border: none;
  outline: none;
  background: transparent;
  padding: 10px;
  font-size: 16px;
}

#sendBtn {
  border: none;
  background: #2563eb;
  color: white;
  width: 45px;
  height: 45px;
  border-radius: 12px;
  cursor: pointer;
  font-size: 18px;
}

#sendBtn:active {
  transform: scale(0.95);
}

/* Dark mode */
body.dark {
  background: #111827;
  color: white;
}

.dark .header {
  background: #111827;
  border-color: #374151;
}

.dark #themeBtn {
  background: #374151;
  color: white;
}

.dark .ai .bubble {
  background: #1f2937;
}

.dark .input-area {
  background: rgba(17,24,39,0.96);
  border-color: #374151;
}

.dark .input-box {
  background: #1f2937;
}

.dark #userInput {
  color: white;
}

.dark .welcome p {
  color: #9ca3af;
}
</style>
</head>

<body>

<header class="header">
  <div class="logo">Kartik<span>.ai</span></div>
  <button id="themeBtn">🌙</button>
</header>

<main class="chat" id="chat">

  <div class="welcome" id="welcome">
    <h1>Welcome to Kartik.ai</h1>
    <p>Ask me anything 👋</p>
  </div>

</main>

<div class="input-area">
  <div class="input-box">
    <input
      id="userInput"
      type="text"
      placeholder="Message Kartik.ai..."
      autocomplete="off"
    >
    <button id="sendBtn">➤</button>
  </div>
</div>

<script>
const input = document.getElementById("userInput");
const sendBtn = document.getElementById("sendBtn");
const chat = document.getElementById("chat");
const welcome = document.getElementById("welcome");
const themeBtn = document.getElementById("themeBtn");

function addMessage(text, type) {
  const message = document.createElement("div");
  message.className = "message " + type;

  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.textContent = text;

  message.appendChild(bubble);
  chat.appendChild(message);

  chat.scrollTop = chat.scrollHeight;
}

function getDemoReply(text) {
  const msg = text.toLowerCase();

  if (msg.includes("hello") || msg.includes("hi")) {
    return "Hello! 👋 I am Kartik.ai. How can I help you?";
  }

  if (msg.includes("who are you")) {
    return "I am Kartik.ai, your AI assistant.";
  }

  if (msg.includes("html")) {
    return "HTML is used to create the structure of a website.";
  }

  if (msg.includes("javascript")) {
    return "JavaScript makes websites interactive and dynamic.";
  }

  return "I received your message: " + text +
         "\n\nThis is currently a demo response. Connect an AI API through a secure backend to get real AI answers.";
}

function sendMessage() {
  const text = input.value.trim();

  if (!text) return;

  welcome.style.display = "none";

  addMessage(text, "user");

  input.value = "";

  setTimeout(() => {
    const reply = getDemoReply(text);
    addMessage(reply, "ai");
  }, 500);
}

sendBtn.addEventListener("click", sendMessage);

input.addEventListener("keydown", function(event) {
  if (event.key === "Enter") {
    sendMessage();
  }
});

themeBtn.addEventListener("click", function() {
  document.body.classList.toggle("dark");

  if (document.body.classList.contains("dark")) {
    themeBtn.textContent = "☀️";
  } else {
    themeBtn.textContent = "🌙";
  }
});
</script>

</body>
</html>
</html>
